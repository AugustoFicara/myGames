<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 220" width="256" height="220" fill="none">
  <defs>
    <!-- Gradiente principal del joystick -->
    <linearGradient id="padGrad" x1="25" y1="35" x2="205" y2="175" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A3FF33" />
      <stop offset="45%" stop-color="#22C55E" />
      <stop offset="85%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Brillo interior del cuerpo -->
    <linearGradient id="innerHighlight" x1="40" y1="40" x2="120" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D9F99D" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0" />
    </linearGradient>

    <!-- Gradiente del tilde verde -->
    <linearGradient id="checkGrad" x1="125" y1="75" x2="225" y2="165" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BEF264" />
      <stop offset="50%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Sombra suave -->
    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#020617" flood-opacity="0.45" />
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- Gatillos superiores L1 / R1 -->
    <path d="M56 36 C56 26, 86 26, 88 36 Z" fill="#22C55E" stroke="#080D2B" stroke-width="7" stroke-linejoin="round" />
    <path d="M168 36 C170 26, 200 26, 200 36 Z" fill="#0EA5E9" stroke="#080D2B" stroke-width="7" stroke-linejoin="round" />

    <!-- Cuerpo principal del joystick -->
    <path d="M58 36 
             C42 36, 30 48, 26 70 
             L16 128 
             C12 152, 26 172, 46 172 
             C60 172, 70 160, 82 142 
             L174 142 
             C186 160, 196 172, 210 172 
             C230 172, 244 152, 240 128 
             L230 70 
             C226 48, 214 36, 198 36 
             L164 36 
             C156 36, 152 44, 144 44 
             L112 44 
             C104 44, 100 36, 92 36 Z" fill="url(#padGrad)" stroke="#080D2B" stroke-width="9" stroke-linejoin="round" />

    <!-- Brillo izquierdo del agarre -->
    <path d="M46 54 C38 66, 31 102, 28 134 C27 144, 33 152, 41 152" stroke="url(#innerHighlight)" stroke-width="6" stroke-linecap="round" />

    <!-- Panel central / Touchpad -->
    <path d="M98 40 L158 40 L152 62 C150 67, 145 70, 140 70 L116 70 C111 70, 106 67, 104 62 Z" fill="#86EFAC" fill-opacity="0.45" stroke="#080D2B" stroke-width="5" stroke-linejoin="round" />

    <!-- Cruceta (D-Pad) -->
    <path d="M62 66 H76 V80 H90 V94 H76 V108 H62 V94 H48 V80 H62 Z" fill="#4ADE80" stroke="#080D2B" stroke-width="5.5" stroke-linejoin="round" />

    <!-- Botones Start / Select -->
    <rect x="104" y="86" width="12" height="7" rx="3.5" fill="#22C55E" stroke="#080D2B" stroke-width="4.5" />
    <path d="M136 86 L146 89.5 L136 93 Z" fill="#22C55E" stroke="#080D2B" stroke-width="4.5" stroke-linejoin="round" />

    <!-- Stick analógico izquierdo -->
    <circle cx="96" cy="118" r="14" fill="#10B981" stroke="#080D2B" stroke-width="5.5" />
    <circle cx="94" cy="116" r="5" fill="#A7F3D0" fill-opacity="0.6" />

    <!-- Botones de acción (ABXY) -->
    <circle cx="184" cy="68" r="9.5" fill="#A3FF33" stroke="#080D2B" stroke-width="5" />
    <circle cx="166" cy="86" r="9.5" fill="#38BDF8" stroke="#080D2B" stroke-width="5" />
    <circle cx="202" cy="86" r="9.5" fill="#A855F7" stroke="#080D2B" stroke-width="5" />
    <circle cx="184" cy="104" r="9.5" fill="#22C55E" stroke="#080D2B" stroke-width="5" />

    <!-- Tilde / Checkmark superpuesto -->
    <path d="M132 118 
             L162 148 
             L226 80 
             C231 75, 239 75, 244 80 
             L251 87 
             C256 92, 256 100, 251 105 
             L171 189 
             C166 194, 158 194, 153 189 
             L114 148 
             C109 143, 109 135, 114 130 
             L121 123 
             C124 119, 128 117, 132 118 Z" fill="url(#checkGrad)" stroke="#080D2B" stroke-width="9" stroke-linejoin="round" />

    <!-- Reflejo superior del tilde -->
    <path d="M165 156 L232 86" stroke="#ECFCCB" stroke-width="4" stroke-linecap="round" stroke-opacity="0.75" />
  </g>
</svg>